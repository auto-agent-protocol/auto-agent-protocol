                      notes: Closed on major U.S. federal holidays. Service department closes 30 minutes before sales.
                      fees:
                        - name: Documentation fee
                          amount: 500
                        - name: Pre-installed theft protection
                          amount: 1000
                      capabilities:
                        - sales
                        - service
                        - parts
                        - financing
                        - trade_in
                        - delivery
                    - name: Demo Honda Oakland
                      legal_name: Demo Honda of Oakland, LLC
                      website: https://demo-honda.example.com
