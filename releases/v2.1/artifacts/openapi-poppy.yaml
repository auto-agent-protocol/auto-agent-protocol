        "400":
          description: Malformed JSON or a request that cannot be processed.
          headers:
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, expired or invalid token/proof. For use_dpop_nonce, retry with the DPoP-Nonce value and a fresh
            proof. No skill execution.
          headers:
            WWW-Authenticate: &a2
              schema:
                type: string
              description: PAP/RFC 9449 DPoP challenge. Read error, scope or extension attributes before interpreting a skill error
                body.
            DPoP-Nonce: *a1
        "403":
          description: PAP authorization or extension_required challenge, or an AAP consent error. Authentication errors need no
            AAP body. No skill execution.
          headers:
            WWW-Authenticate: *a2
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Vehicle or implemented skill not found.
          headers:
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Vehicle/appointment unavailable or idempotency conflict.
          headers:
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: AAP schema validation failed, including a mismatched request type.
          headers:
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited. Honor Retry-After before retrying.
          headers:
            Retry-After:
              schema:
                type: string
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal skill failure.
          headers:
            DPoP-Nonce: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
