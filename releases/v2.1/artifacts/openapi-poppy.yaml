  /skills/inventory.search:
    post:
      operationId: inventory_search
      x-aap-skill: inventory.search
      summary: Inventory Search
      description: Search vehicle inventory by query, make, model, trim, year, condition, price, mileage, body style/segment,
        VIN, stock, features, and availability — across cars, motorcycles, and other vehicle types, including filters
        such as vehicle type, body/segment, and engine displacement, plus electric filters such as electric range and DC
        fast charging. Uses the unchanged AAP payload with a Poppy signed-out session; no customer account sign-in is
        required. lead.submit still requires explicit contact consent.
      security:
        - poppySession: []
      parameters:
        - name: DPoP
          in: header
          required: true
          description: Fresh RFC 9449 proof bound to the access token, request method and URL; never a static API key.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySearchRequest"
            example:
              type: inventory.search.request
              filters:
                make:
                  - Honda
                  - BMW
                model:
                  - CR-V
                condition:
                  - used
                year_min: 2023
                year_max: 2025
                price_max: 35000
                transmission:
                  - automatic
                rooftops:
                  - Demo Toyota San Francisco
              pagination:
                skip: 0
                limit: 100
              sort:
                field: price
                order: asc
              privacy:
                anonymous: true
      responses:
        "200":
          description: Typed AAP response; a lead acknowledgment is not a confirmed appointment or sale.
          headers:
            DPoP-Nonce: *a1
          content:
