  /skills/inventory.vehicle:
    post:
      operationId: inventory_vehicle
      x-aap-skill: inventory.vehicle
      summary: Vehicle Detail
      description: Return details for a specific car or motorcycle by VIN, stock number, or vehicle_id, including status,
        pricing disclosure, photos, mileage, trim, features, fuel economy or engine displacement, electric
        range/battery/charging for BEV and PHEV units, and dealer page URL. Uses the unchanged AAP payload with a Poppy
        signed-out session; no customer account sign-in is required. lead.submit still requires explicit contact
        consent.
      security:
        - poppySession: []
      parameters:
        - name: DPoP
          in: header
          required: true
          description: Fresh RFC 9449 proof bound to the access token, request method and URL; never a static API key.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleDetailRequest"
            example:
              type: inventory.vehicle.request
              vin: 1HGCY2F57RA000001
      responses:
        "200":
          description: Typed AAP response; a lead acknowledgment is not a confirmed appointment or sale.
