openapi: 3.1.0
info:
  title: Auto Agent Protocol — Poppy guest API
  description: AAP 2.1.0 automotive payloads over Personal Agent Protocol draft 0.2 OpenAPI APIs. Operators MUST publish a
    deployment-specific copy with real servers and only implemented skills. Verify poppy.json and RFC 8414 issuer
    metadata, then obtain a guest Session Token using two signed assertions and a DPoP proof. Both assertion audiences
    must exactly equal auth.issuer; the proof htu is the token endpoint. Client identity keys are required; customer
    sign-in is not. OAuth endpoints are discovered from the issuer, not inferred from this reference server.
  version: 2.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Auto Agent Protocol
    url: https://autoagentprotocol.org
x-aap-extension: https://autoagentprotocol.org/extensions/aap/v2.1
x-poppy-protocol-version: "0.2"
externalDocs:
  url: https://personalagentprotocol.org/docs/0.2/spec
  description: Normative PAP discovery, client identity and session authorization
servers:
  - url: https://demo-toyota.example.com/poppy
    description: Illustrative dealer API base; replace before publication
paths:
  /skills/dealer.information:
    post:
      operationId: dealer_information
      x-aap-skill: dealer.information
      summary: Dealer Information
      description: Return the dealership profile — group name, welcome message, and one or more rooftops (locations) with
        address, geo, contacts, business hours, timezone, default dealer fees, and service capabilities (including tags
        such as motorcycle_sales / powersports). Uses the unchanged AAP payload with a Poppy signed-out session; no
        customer account sign-in is required. lead.submit still requires explicit contact consent.
      security:
        - poppySession: []
      parameters:
        - name: DPoP
          in: header
          required: true
          description: Fresh RFC 9449 proof bound to the access token, request method and URL; never a static API key.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInformationRequest"
            example:
              type: dealer.information.request
      responses:
        "200":
          description: Typed AAP response; a lead acknowledgment is not a confirmed appointment or sale.
          headers:
            DPoP-Nonce: &a1
              schema:
                type: string
              description: Use the latest server nonce in a fresh DPoP proof on the next request to this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerInformationResponse"
              example:
                type: dealer.information.response
                data:
                  name: Demo Auto Group
                  welcome_message: Welcome to Demo Auto Group. We're happy to help by phone, video, or in person at either of our Bay Area
                    locations.
                  rooftops:
                    - name: Demo Toyota San Francisco
                      legal_name: Demo Toyota of San Francisco, LLC
                      website: https://demo-toyota.example.com
                      geo:
                        latitude: 37.7726
