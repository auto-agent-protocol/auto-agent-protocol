<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Five skills cover the read-and-lead lifecycle. A dealer agent implements one or more skills; none is individually mandatory.">
  <title>Five skills cover the read-and-lead lifecycle</title>
  <desc>A dealer agent implements one or more skills; none is individually mandatory.</desc>
