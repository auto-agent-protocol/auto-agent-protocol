  <g class="diagram-card"><rect x="76" y="245" width="270.4" height="529" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="100" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="100" dy="0">01</tspan></text><text x="100" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="100" dy="0">dealer.information</tspan></text><text x="100" y="381.82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="100" dy="0">Group profile, rooftops,</tspan><tspan x="100" dy="24.12">hours, contacts,</tspan><tspan x="100" dy="24.12">capabilities and default</tspan><tspan x="100" dy="24.12">fee schedules.</tspan></text></g><g class="diagram-card"><rect x="370.4" y="245" width="270.4" height="529" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="394.4" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="394.4" dy="0">02</tspan></text><text x="394.4" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="394.4" dy="0">inventory.facets</tspan></text><text x="394.4" y="381.82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="394.4" dy="0">Available buckets and</tspan><tspan x="394.4" dy="24.12">ranges before a buyer</tspan><tspan x="394.4" dy="24.12">composes a precise</tspan><tspan x="394.4" dy="24.12">search.</tspan></text></g><g class="diagram-card"><rect x="664.8" y="245" width="270.4" height="529" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="3" filter="url(#shadow)"/><text x="688.8" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="688.8" dy="0">03</tspan></text><text x="688.8" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="688.8" dy="0">inventory.search</tspan></text><text x="688.8" y="381.82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="688.8" dy="0">Filtered, paginated</tspan><tspan x="688.8" dy="24.12">inventory with</tspan><tspan x="688.8" dy="24.12">authoritative pricing</tspan><tspan x="688.8" dy="24.12">when available.</tspan></text></g><g class="diagram-card"><rect x="959.1999999999999" y="245" width="270.4" height="529" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="983.1999999999999" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="983.1999999999999" dy="0">04</tspan></text><text x="983.1999999999999" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="983.1999999999999" dy="0">inventory.vehicle</tspan></text><text x="983.1999999999999" y="381.82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="983.1999999999999" dy="0">One complete vehicle</tspan><tspan x="983.1999999999999" dy="24.12">record by VIN, stock</tspan><tspan x="983.1999999999999" dy="24.12">number or vehicle_id.</tspan></text></g><g class="diagram-card"><rect x="1253.6" y="245" width="270.4" height="529" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="3" filter="url(#shadow)"/><text x="1277.6" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1277.6" dy="0">05</tspan></text><text x="1277.6" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1277.6" dy="0">lead.submit</tspan></text><text x="1277.6" y="381.82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1277.6" dy="0">Customer, vehicle,</tspan><tspan x="1277.6" dy="24.12">trade-in and appointment</tspan><tspan x="1277.6" dy="24.12">behind explicit consent.</tspan></text></g>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">Recommended starting pair: inventory.search + lead.submit</tspan></text></g>
</svg>
