<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A consented lead, end to end. The dealer validates both the grant and the payload before acknowledging receipt.">
  <title>A consented lead, end to end</title>
  <desc>The dealer validates both the grant and the payload before acknowledging receipt.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20364f" flood-opacity="0.07"/></filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#pageWash)"/>
  <circle cx="1550" cy="-30" r="240" fill="#eaf3ff" opacity="0.68"/>
  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">LEAD LIFECYCLE</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">A consented lead, end to end</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">The dealer validates both the grant and the payload before acknowledging receipt.</tspan></text>
  <image href="data:image/svg+xml;base64," x="1406" y="28" width="88" height="88" aria-hidden="true"/>
  <g class="diagram-card"><rect x="76" y="250" width="341" height="524" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="103.28" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="103.28" dy="0">01</tspan></text><text x="103.28" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="103.28" dy="0">ConsentGrant</tspan></text><text x="103.28" y="390.84000000000003" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="103.28" dy="0">The buyer authorizes lead</tspan><tspan x="103.28" dy="26.8">submission and allowed</tspan><tspan x="103.28" dy="26.8">contact channels.</tspan></text><rect x="103.28" y="493.24" width="286.44" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="117.28" y="518.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="117.28" dy="0">scope: [lead_submission]</tspan></text></g><line x1="423" y1="512" x2="439" y2="512" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 427 503 L 439 512 L 427 521" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="diagram-card"><rect x="445" y="250" width="341" height="524" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="3" filter="url(#shadow)"/><text x="472.28" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="472.28" dy="0">02</tspan></text><text x="472.28" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="472.28" dy="0">lead.submit</tspan></text><text x="472.28" y="390.84000000000003" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="472.28" dy="0">Source agent and consent are</tspan><tspan x="472.28" dy="26.8">required; vehicle, trade-in</tspan><tspan x="472.28" dy="26.8">and appointment are optional.</tspan></text></g><line x1="792" y1="512" x2="808" y2="512" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 796 503 L 808 512 L 796 521" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="diagram-card"><rect x="814" y="250" width="341" height="524" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="841.28" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="841.28" dy="0">03</tspan></text><text x="841.28" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="841.28" dy="0">Dealer validation</tspan></text><text x="841.28" y="390.84000000000003" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="841.28" dy="0">Missing or invalid consent</tspan><tspan x="841.28" dy="26.8">produces a typed error; no</tspan><tspan x="841.28" dy="26.8">lead is created.</tspan></text></g><line x1="1161" y1="512" x2="1177" y2="512" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 1165 503 L 1177 512 L 1165 521" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="diagram-card"><rect x="1183" y="250" width="341" height="524" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="3" filter="url(#shadow)"/><text x="1210.28" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1210.28" dy="0">04</tspan></text><text x="1210.28" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1210.28" dy="0">Acknowledgement</tspan></text><text x="1210.28" y="390.84000000000003" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1210.28" dy="0">The response returns a</tspan><tspan x="1210.28" dy="26.8">lead_id and received status;</tspan><tspan x="1210.28" dy="26.8">ADF mapping may follow.</tspan></text><rect x="1210.28" y="493.24" width="286.44" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1224.28" y="518.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1224.28" dy="0">status: received</tspan></text></g>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">No consent, no lead—the privacy gate is part of the protocol.</tspan></text></g>
</svg>
