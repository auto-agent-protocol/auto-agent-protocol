<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="optional-skill-delivery-title optional-skill-delivery-desc" aria-label="A dealer can deliver trade_in_submit to its CRM as an ADF/XML lead and reply received, or call a valuation API and reply valued. credit_application_submit goes only through a secure API to the dealer or lender credit system and is never relayed through ADF/XML or email.">
<title id="optional-skill-delivery-title">Trade-in: ADF or API. Credit: API only.</title><desc id="optional-skill-delivery-desc">A dealer can deliver trade_in_submit to its CRM as an ADF/XML lead and reply received, or call a valuation API and reply valued. credit_application_submit goes only through a secure API to the dealer or lender credit system and is never relayed through ADF/XML or email. Either trade-in path is the same tool. Applicant identifiers never travel through ADF/XML, email or CRM notes.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">HOW A DEALER DELIVERS THE OPTIONAL SKILLS</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Trade-in: ADF or API. Credit: API only.</text>
<rect x="48" y="204" width="542" height="408" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(72 226) scale(1.8333333333333333)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 3-7h12l3 7v8H3zM3 11h18M7 4l-1 7M17 4l1 7M6 15h2M16 15h2M6 19v3M18 19v3"/></g><text x="132" y="250" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="434">trade_in_submit</text><text x="132" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="434">Two ways to deliver, one tool</text><rect x="72" y="552" width="494" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="319" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="470">Declare instant_valuation: false or true</text><rect x="72" y="312" width="494" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(92 335) scale(1.8333333333333333)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="15" rx="3"/><path d="m3 7 9 7 9-7"/></g><text x="154" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="394">ADF/XML to the CRM</text><text x="154" y="381" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="394">Reply received · dealer follows up</text><rect x="72" y="424" width="494" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(92 447) scale(1.8333333333333333)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m7 6-6 6 6 6M17 6l6 6-6 6M14 3l-4 18"/></g><text x="154" y="463" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="394">Valuation API</text><text x="154" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="394">Reply valued · amount or range now</text><rect x="610" y="204" width="542" height="408" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(634 226) scale(1.8333333333333333)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="694" y="250" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="434">credit_application_submit</text><text x="694" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="434">One way to deliver</text><rect x="634" y="552" width="494" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="881" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="470">Declare inquiry_types and national_id</text><rect x="634" y="312" width="494" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(654 335) scale(1.8333333333333333)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></g><text x="716" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="394">Secure API only</text><text x="716" y="381" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="394">To the dealer or lender credit system</text><rect x="634" y="424" width="494" height="96" rx="20" fill="#fff4dc" stroke="#93600b" stroke-width="2"/><g transform="translate(654 447) scale(1.8333333333333333)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></g><text x="716" y="463" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="394">Never ADF or email</text><text x="716" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="394">Applicant data is sensitive</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Either trade-in path is the same tool. Applicant identifiers never travel through ADF/XML, email or CRM notes.</text>
