<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-versions-title poppy-versions-desc" aria-label="A personal agent reads poppy.json 1.0 and its optional supported_versions, chooses the newest compatible version and sends it in Poppy-Version on every request with the Session header. version_unsupported (HTTP 400) means refetch poppy.json and choose again.">
<title id="poppy-versions-title">Choose one version. Declare it on every request.</title><desc id="poppy-versions-desc">A personal agent reads poppy.json 1.0 and its optional supported_versions, chooses the newest compatible version and sends it in Poppy-Version on every request with the Session header. version_unsupported (HTTP 400) means refetch poppy.json and choose again. Keep one Poppy-Version per Session. A missing or incompatible version is never handled under another.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP 1.0 VERSIONS</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Choose one version. Declare it on every request.</text>
<rect x="48" y="196" width="348" height="270" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><rect x="72" y="216" width="64" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="104" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="40">01</text><g transform="translate(188 250) scale(2.8333333333333335)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="222" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="312">Fetch poppy.json</text><text x="222" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">protocol_version: 1.0</text><text x="222" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Optional supported_versions</text><path d="M398 331L420 331" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="410,337 420,331 410,325" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="426" y="196" width="348" height="270" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><rect x="450" y="216" width="64" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="482" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="40">02</text><g transform="translate(566 250) scale(2.8333333333333335)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/><circle cx="8" cy="5" r="2"/><circle cx="16" cy="12" r="2"/></g><text x="600" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="312">Choose the newest</text><text x="600" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Compatible means</text><text x="600" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">the same major version</text><path d="M776 331L798 331" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="788,337 798,331 788,325" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="804" y="196" width="348" height="270" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><rect x="828" y="216" width="64" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="860" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="40">03</text><g transform="translate(944 250) scale(2.8333333333333335)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="m12 12 10 10M17 17l3-3M20 20l3-3"/></g><text x="978" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="312">Declare it</text><text x="978" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Poppy-Version: 1.0</text><text x="978" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">On every Session request</text><path d="M600 498L600 472" fill="none" stroke="#93600b" stroke-width="3" stroke-linecap="round"/><polyline points="606,482 600,472 594,482" fill="none" stroke="#93600b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="500" width="1104" height="110" rx="20" fill="#fff4dc" stroke="#fff4dc" stroke-width="2"/><g transform="translate(76 529) scale(2.1666666666666665)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 1 1 4 3l-1 1v2M12 18h.01"/></g><text x="152" y="548" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="700">HTTP 400 version_unsupported</text><text x="152" y="586" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="980">Refetch poppy.json and choose again; a new version starts a new Session, retried once.</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Keep one Poppy-Version per Session. A missing or incompatible version is never handled under another.</text>
</svg>
