<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="rebates-price-title rebates-price-desc" aria-label="List price plus mandatory fees minus an unconditional customer cash rebate gives the advertised price. Conditional military and college rebates stay separate as possible extra savings and are never subtracted.">
<title id="rebates-price-title">Unconditional rebates are already in the price.</title><desc id="rebates-price-desc">List price plus mandatory fees minus an unconditional customer cash rebate gives the advertised price. Conditional military and college rebates stay separate as possible extra savings and are never subtracted. Never subtract a rebate from price again. Never advertise price minus conditional rebates.</desc>
