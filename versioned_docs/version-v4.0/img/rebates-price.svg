t-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="360">Conditional rebates</text><text x="760" y="282" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="360">is_conditional: true or omitted</text><rect x="760" y="310" width="362" height="54" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="784" y="344" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="220">Military</text><text x="1098" y="344" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="600" fill="#93600b" text-anchor="end" data-max-width="120">$500</text><rect x="760" y="376" width="362" height="54" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="784" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="220">College</text><text x="1098" y="410" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="600" fill="#93600b" text-anchor="end" data-max-width="120">$500</text><text x="760" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="362">Possible extra saving,</text><text x="760" y="508.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="362">subject to eligibility</text><rect x="760" y="548" width="362" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="941" y="572" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#93600b" text-anchor="middle" data-max-width="338">Never subtracted from price</text>
