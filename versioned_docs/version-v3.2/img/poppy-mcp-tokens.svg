<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-mcp-tokens-title poppy-mcp-tokens-desc" aria-label="Native PAP MCP carries a delegated Session JWT. Signed-out access needs no token. Account access adds an ordinary resource-appropriate OAuth token; DPoP remains separate when that token is bound.">
<title id="poppy-mcp-tokens-title">Verify the Session. Add OAuth when needed.</title><desc id="poppy-mcp-tokens-desc">Native PAP MCP carries a delegated Session JWT. Signed-out access needs no token. Account access adds an ordinary resource-appropriate OAuth token; DPoP remains separate when that token is bound. Published 0.3 does not require the old guest-token exchange. Advertise only implemented access.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP 0.3 AND MCP</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Verify the Session. Add OAuth when needed.</text>
<rect x="48" y="192" width="1104" height="68" rx="20" fill="#eaf2ff" stroke="#2874d7" stroke-width="2"/><text x="600" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="650" fill="#1855a6" text-anchor="middle" data-max-width="1040">Use the advertised native PAP MCP endpoint</text><path d="M310 264L310 302" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="304,292 310,302 316,292" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M890 264L890 302" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="884,292 890,302 896,292" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="310" width="530" height="296" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><rect x="622" y="310" width="530" height="296" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><rect x="76" y="334" width="474" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="313" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="450">Signed out</text><rect x="650" y="334" width="474" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="887" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="450">Account access</text><text x="80" y="414" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">Poppy-Session header</text><text x="80" y="447.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">No access token</text><text x="80" y="480.7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">No guest grant</text><text x="654" y="414" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">Poppy-Session + OAuth</text><text x="654" y="447.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">ath binds access token</text><text x="654" y="480.7" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="466">DPoP if token is bound</text><path d="M310 505L310 538" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="304,528 310,538 316,528" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M890 505L890 538" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="884,528 890,538 896,528" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="313" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#1855a6" text-anchor="middle" data-max-width="474">Verified Session</text><text x="887" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#087d70" text-anchor="middle" data-max-width="474">Account + scopes</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Published 0.3 does not require the old guest-token exchange. Advertise only implemented access.</text>
