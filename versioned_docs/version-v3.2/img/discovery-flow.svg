<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="discovery-flow-title discovery-flow-desc" aria-label="The dealer domain publishes agent-card.json, poppy.json and llms.txt, which cross-link the same MCP, A2A and PAP deployment.">
<title id="discovery-flow-title">Find the dealer. Discover its interfaces.</title><desc id="discovery-flow-desc">The dealer domain publishes agent-card.json, poppy.json and llms.txt, which cross-link the same MCP, A2A and PAP deployment. A provider can host the service. The dealership domain remains the entry point.</desc>
