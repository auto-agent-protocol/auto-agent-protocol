<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="error-anatomy-title error-anatomy-desc" aria-label="The shared aap.error has a code, message, retryable flag and useful details. MCP, A2A and PAP place that object in their native response envelopes.">
<title id="error-anatomy-title">One error object, three delivery formats.</title><desc id="error-anatomy-desc">The shared aap.error has a code, message, retryable flag and useful details. MCP, A2A and PAP place that object in their native response envelopes. Fix a bad request. Wait when rate-limited. Retry a write with its original idempotency key.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">ACTIONABLE ERRORS</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">One error object, three delivery formats.</text>
<rect x="48" y="210" width="622" height="398" rx="20" fill="#12213a" stroke="#12213a" stroke-width="2"/><text x="80" y="266" font-family="DejaVu Sans Mono, monospace" font-size="27" font-weight="600" fill="#ffffff" text-anchor="start" data-max-width="556">type: &quot;aap.error&quot;</text><text x="80" y="334" font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="500" fill="#ffffff" text-anchor="start" data-max-width="556">code: &quot;UNSUPPORTED_FILTER&quot;</text><text x="80" y="395" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="start" data-max-width="556">message: &quot;Filter is not supported&quot;</text><text x="80" y="456" font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="500" fill="#ffffff" text-anchor="start" data-max-width="556">retryable: false</text><text x="80" y="517" font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="500" fill="#ffffff" text-anchor="start" data-max-width="556">details: { field: &quot;near&quot; }</text><path d="M670 399C720 399 720 272 770 272" fill="none" stroke="#d8e1ed" stroke-width="3"/><rect x="770" y="224" width="382" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="961" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="338">MCP structuredContent</text><path d="M670 399C720 399 720 400 770 400" fill="none" stroke="#d8e1ed" stroke-width="3"/><rect x="770" y="352" width="382" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="961" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="338">A2A standard detail</text><path d="M670 399C720 399 720 528 770 528" fill="none" stroke="#d8e1ed" stroke-width="3"/><rect x="770" y="480" width="382" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="961" y="538" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="338">PAP JSON body</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Fix a bad request. Wait when rate-limited. Retry a write with its original idempotency key.</text>
