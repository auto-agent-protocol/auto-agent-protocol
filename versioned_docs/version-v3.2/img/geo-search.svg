<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="geo-search-title geo-search-desc" aria-label="A latitude, longitude and radius define great-circle distance to a vehicle's selling rooftop. Results return distance_mi and can sort by it.">
