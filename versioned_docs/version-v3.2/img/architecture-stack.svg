<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-stack-title architecture-stack-desc" aria-label="AAP defines automotive payloads and behavior. Native MCP tools, A2A messages and PAP APIs carry that same contract to a dealer backend.">
