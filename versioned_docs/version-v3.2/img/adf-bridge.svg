<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="adf-bridge-title adf-bridge-desc" aria-label="An approved AAP lead maps into a CRM's verified ADF/XML format. Consent, idempotency and fields without an XML equivalent stay in a separate durable record.">
