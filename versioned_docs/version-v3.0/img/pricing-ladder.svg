<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="pricing-ladder-title pricing-ladder-desc" aria-label="The advertised vehicle price already includes mandatory dealer charges. Optional fee itemization explains that total. Government-required consumer charges remain separate.">
<title id="pricing-ladder-title">One price, including mandatory dealer charges.</title><desc id="pricing-ladder-desc">The advertised vehicle price already includes mandatory dealer charges. Optional fee itemization explains that total. Government-required consumer charges remain separate. Do not add included fees twice. Conditional rebates never reduce the advertised price.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PRICE SEMANTICS</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">One price, including mandatory dealer charges.</text>
<rect x="48" y="210" width="632" height="398" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="80" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="566">Vehicle price</text><text x="80" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="76" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="566">$32,995</text><rect x="80" y="382" width="568" height="36" rx="18" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="364" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="544">Includes mandatory dealer charges</text><path d="M80 453L648 453" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="80" y="491" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="566">Illustrative price components</text><text x="80" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="566">$32,500 vehicle  +  $495 dealer fee</text><rect x="716" y="210" width="436" height="188" rx="20" fill="#eaf2ff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(744 238) scale(1.6666666666666667)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="804" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="650" fill="#1855a6" text-anchor="start" data-max-width="320">Fee breakdown</text><text x="744" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="380">Explains the total.</text><text x="744" y="357.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="380">Never added a second time.</text><rect x="716" y="426" width="436" height="182" rx="20" fill="#fff4dc" stroke="#fff4dc" stroke-width="2"/><text x="744" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="380">Separate government charges</text><text x="744" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="380">Only charges the government</text><text x="744" y="554.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="380">requires the consumer to pay.</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Do not add included fees twice. Conditional rebates never reduce the advertised price.</text>
</svg>
