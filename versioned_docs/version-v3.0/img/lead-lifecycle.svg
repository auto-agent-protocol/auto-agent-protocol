<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="lead-lifecycle-title lead-lifecycle-desc" aria-label="The dealer validates consent and an idempotency key, then reports received, duplicate or rejected. Appointment status is a separate outcome.">
