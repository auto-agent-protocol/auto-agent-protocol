<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="versioning-timeline-title versioning-timeline-desc" aria-label="Editable sources pass schema, behavior and interoperability checks before a new immutable release is prepared and a deployment switches its discovery.">
<title id="versioning-timeline-title">Review. Freeze. Publish. Migrate.</title><desc id="versioning-timeline-desc">Editable sources pass schema, behavior and interoperability checks before a new immutable release is prepared and a deployment switches its discovery. Published contracts stay byte-stable. AAP 3.0 is an explicit major-version migration.</desc>
