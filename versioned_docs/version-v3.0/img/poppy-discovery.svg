<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-discovery-title poppy-discovery-desc" aria-label="The AAP extension can link public MCP. A native PAP MCP API additionally promises session-token support, resource metadata and scopes.">
<title id="poppy-discovery-title">A public link does not grant PAP access.</title><desc id="poppy-discovery-desc">The AAP extension can link public MCP. A native PAP MCP API additionally promises session-token support, resource metadata and scopes. Never forward a PAP token merely because a public MCP URL appears in discovery.</desc>
