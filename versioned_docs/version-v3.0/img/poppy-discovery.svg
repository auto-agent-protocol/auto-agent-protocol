<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP AND PUBLIC MCP</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">A public link does not grant PAP access.</text>
<rect x="48" y="210" width="530" height="394" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><rect x="76" y="238" width="474" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="313" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="450">AAP extension pointer</text><g transform="translate(278 312) scale(2.9166666666666665)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3a6 6 0 0 0-7 8L2 18a3 3 0 0 0 4 4l7-6a6 6 0 0 0 8-7l-5 3-4-4z"/></g><text x="313" y="431" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="474">Public MCP</text><text x="313" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="474">Exact endpoint URL</text><text x="313" y="513.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="474">Its own access policy</text><rect x="608" y="210" width="544" height="394" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><rect x="636" y="238" width="488" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="880" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="464">Native PAP apis: &quot;mcp&quot;</text><g transform="translate(845 312) scale(2.9166666666666665)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="m12 12 10 10M17 17l3-3M20 20l3-3"/></g><text x="880" y="431" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="488">PAP-authorized MCP</text><text x="880" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="488">Session token + resource metadata</text><text x="880" y="513.35" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="488">Exact resource URL + scopes</text>
