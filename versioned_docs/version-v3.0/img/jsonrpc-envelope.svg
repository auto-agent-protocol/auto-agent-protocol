<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="jsonrpc-envelope-title jsonrpc-envelope-desc" aria-label="JSON-RPC SendMessage wraps an A2A Message and a typed AAP DataPart. HTTP headers select A2A 1.0 and the exact AAP extension URI.">
<title id="jsonrpc-envelope-title">One operation carries every automotive skill.</title><desc id="jsonrpc-envelope-desc">JSON-RPC SendMessage wraps an A2A Message and a typed AAP DataPart. HTTP headers select A2A 1.0 and the exact AAP extension URI. Activate the selected AAP extension on every call. Keep its URI exact.</desc>
