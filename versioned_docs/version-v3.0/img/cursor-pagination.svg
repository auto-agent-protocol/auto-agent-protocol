<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="cursor-pagination-title cursor-pagination-desc" aria-label="The service returns an opaque next_cursor for each page and null at completion. Filters, query, sort and page size stay fixed across the cursor sequence.">
<title id="cursor-pagination-title">Follow every page to complete the search.</title><desc id="cursor-pagination-desc">The service returns an opaque next_cursor for each page and null at completion. Filters, query, sort and page size stay fixed across the cursor sequence. Do not combine cursor and skip. An expired or mismatched cursor is INVALID_CURSOR.</desc>
