<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="consent-gate-title consent-gate-desc" aria-label="Public information and inventory reads stay before the consent gate. An approved payload and contact channels allow one idempotent lead submission.">
<title id="consent-gate-title">The shopper controls the handoff.</title><desc id="consent-gate-desc">Public information and inventory reads stay before the consent gate. An approved payload and contact channels allow one idempotent lead submission. Agent authentication identifies the caller. It does not grant customer contact consent.</desc>
