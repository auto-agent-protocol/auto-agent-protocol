serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Match cookie + code</text><text x="978" y="476.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Consume first attempt</text><text x="978" y="506.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="306">Active Session only</text><rect x="48" y="568" width="1104" height="48" rx="20" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="600" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#087d70" text-anchor="middle" data-max-width="1040">303 + Session cookie only after verification</text>
