<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-browser-join-title poppy-browser-join-desc" aria-label="The agent's own browser loads a short-lived code and a protected join cookie. Trusted agent code signs a Session-key proof whose nonce is the code. The Company consumes the first submission, verifies the cookie, code, proof and active Session, then sets the Session cookie.">
<title id="poppy-browser-join-title">Join the browser with its own one-time code.</title><desc id="poppy-browser-join-desc">The agent's own browser loads a short-lived code and a protected join cookie. Trusted agent code signs a Session-key proof whose nonce is the code. The Company consumes the first submission, verifies the cookie, code, proof and active Session, then sets the Session cookie. Never sign a code from a message. It must come from the agent's own browser endpoint page.</desc>
