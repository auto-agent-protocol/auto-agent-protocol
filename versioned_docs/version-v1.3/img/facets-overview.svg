  <g class="diagram-card"><rect x="76" y="245" width="466.6666666666667" height="292.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="110" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="110" dy="0">IDENTITY</tspan></text><text x="110" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="110" dy="0">What is available</tspan></text><text x="110" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="110" dy="0">makes · models · trims · years ·</tspan><tspan x="110" dy="26.8">conditions · statuses</tspan></text></g><g class="diagram-card"><rect x="566.6666666666667" y="245" width="466.6666666666667" height="292.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="600.6666666666667" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="600.6666666666667" dy="0">VEHICLE CLASS</tspan></text><text x="600.6666666666667" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="600.6666666666667" dy="0">What kind</tspan></text><text x="600.6666666666667" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="600.6666666666667" dy="0">vehicle_types · bodies · fuels ·</tspan><tspan x="600.6666666666667" dy="26.8">drivelines · rooftops</tspan></text></g><g class="diagram-card"><rect x="1057.3333333333335" y="245" width="466.6666666666667" height="292.5" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="3" filter="url(#shadow)"/><text x="1091.3333333333335" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="1091.3333333333335" dy="0">ELECTRIC</tspan></text><text x="1091.3333333333335" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1091.3333333333335" dy="0">How it is powered</tspan></text><text x="1091.3333333333335" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1091.3333333333335" dy="0">charge_ports · dc_fast_charge ·</tspan><tspan x="1091.3333333333335" dy="26.8">electric_range_mi_range</tspan></text></g><g class="diagram-card"><rect x="76" y="561.5" width="466.6666666666667" height="292.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="110" y="605.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="110" dy="0">RANGES</tspan></text><text x="110" y="647.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="110" dy="0">Useful bounds</tspan></text><text x="110" y="706.36" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="110" dy="0">year_range · mileage_range ·</tspan><tspan x="110" dy="26.8">displacement_cc_range</tspan></text></g><g class="diagram-card"><rect x="566.6666666666667" y="561.5" width="466.6666666666667" height="292.5" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="3" filter="url(#shadow)"/><text x="600.6666666666667" y="605.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="600.6666666666667" dy="0">PRICE</tspan></text><text x="600.6666666666667" y="647.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="600.6666666666667" dy="0">Authoritative range</tspan></text><text x="600.6666666666667" y="706.36" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="600.6666666666667" dy="0">price_range uses available price values;</tspan><tspan x="600.6666666666667" dy="26.8">unpriced vehicles do not contribute.</tspan></text><rect x="600.6666666666667" y="781.96" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="614.6666666666667" y="807.4200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="614.6666666666667" dy="0">whole USD</tspan></text></g><g class="diagram-card"><rect x="1057.3333333333335" y="561.5" width="466.6666666666667" height="292.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="1091.3333333333335" y="605.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="1091.3333333333335" dy="0">SCOPING</tspan></text><text x="1091.3333333333335" y="647.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1091.3333333333335" dy="0">Optional filters</tspan></text><text x="1091.3333333333335" y="706.36" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1091.3333333333335" dy="0">Apply inventory.search-shaped filters</tspan><tspan x="1091.3333333333335" dy="26.8">before aggregating the matching subset.</tspan></text></g>
