      <g class="diagram-card"><rect x="92" y="315" width="656" height="209.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="126" y="345" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="126" dy="0">OPEN</tspan></text><text x="126" y="373" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="126" dy="0">Anonymous browsing</tspan></text><text x="126" y="408.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="126" dy="0">No personal data is needed to discover the dealer, facets, inventory or one vehicle.</tspan></text></g><g class="diagram-card"><rect x="92" y="540.5" width="656" height="209.5" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="3" filter="url(#shadow)"/><text x="126" y="570.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="126" dy="0">Allowed skills</tspan></text><text x="126" y="605.62" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="126" dy="0">dealer.information · inventory.facets · inventory.search · inventory.vehicle</tspan></text></g><rect x="830" y="245" width="700" height="529" rx="28" fill="#ffffff" stroke="#c9dced" stroke-width="2"/>
      <text x="864" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2"><tspan x="864" dy="0">AFTER</tspan></text>
      <g class="diagram-card"><rect x="852" y="315" width="656" height="209.5" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="886" y="345" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="886" dy="0">GATED</tspan></text><text x="886" y="373" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="886" dy="0">Consented lead</tspan></text><text x="886" y="408.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="886" dy="0">lead.submit carries customer information only with a valid ConsentGrant.</tspan></text></g><g class="diagram-card"><rect x="852" y="540.5" width="656" height="209.5" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="3" filter="url(#shadow)"/><text x="886" y="570.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="886" dy="0">Grant proves</tspan></text><text x="886" y="605.62" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="886" dy="0">granted_at · allowed_channels · consent_text · scope: lead_submission</tspan></text></g><line x1="784" y1="509.5" x2="816" y2="509.5" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 804 500.5 L 816 509.5 L 804 518.5" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">Missing consent → CONTACT_CONSENT_REQUIRED · invalid grant → INVALID_CONSENT</tspan></text></g>
