<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Browse anonymously; identify the buyer only with consent. Inventory access and lead submission have intentionally different privacy rules.">
  <title>Browse anonymously; identify the buyer only with consent</title>
  <desc>Inventory access and lead submission have intentionally different privacy rules.</desc>
