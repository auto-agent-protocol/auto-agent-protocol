 Arial, sans-serif" font-size="21" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="520">Same request + Poppy-Approval</text><path d="M210 528L770 528" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="760,534 770,528 760,522" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#087d70" text-anchor="start" data-max-width="520">Performed at most once</text><path d="M770 594L210 594" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="220,588 210,594 220,600" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="252" width="322" height="342" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(860 296) scale(2.1666666666666665)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="860" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#087d70" text-anchor="start" data-max-width="270">Still required</text><text x="860" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="270">AAP consent grant in</text><text x="860" y="461" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="270">the request body</text><text x="860" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="270">Same idempotency key</text><text x="860" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="270