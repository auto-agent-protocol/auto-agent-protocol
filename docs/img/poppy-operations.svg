<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">An approval never replaces the AAP consent grant in the body. Resend with the same idempotency key.</text>
