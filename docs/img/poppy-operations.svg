<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-operations-title poppy-operations-desc" aria-label="A write skill request that declares Operations can receive 403 approval_required with exact terms. The user, or the agent on the user's instruction, approves; the identical request is resent with Poppy-Approval and performed at most once.">
<title id="poppy-operations-title">Approve the exact terms. Perform at most once.</title><desc id="poppy-operations-desc">A write skill request that declares Operations can receive 403 approval_required with exact terms. The user, or the agent on the user's instruction, approves; the identical request is resent with Poppy-Approval and performed at most once. An approval never replaces the AAP consent grant in the body. Resend with the same idempotency key.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">OPTIONAL PAP OPERATIONS</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Approve the exact terms. Perform at most once.</text>
