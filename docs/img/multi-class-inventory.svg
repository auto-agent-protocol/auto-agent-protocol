<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="Cars, motorcycles and electric powertrains share one vocabulary. An optional vehicle_type selects class-specific details while common fields stay common.">
  <title>Cars, motorcycles and electric powertrains share one vocabulary</title>
  <desc>An optional vehicle_type selects class-specific details while common fields stay common.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20364f" flood-opacity="0.07"/></filter>
