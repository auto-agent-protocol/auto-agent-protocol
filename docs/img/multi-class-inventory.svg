  <g class="diagram-card"><rect x="76" y="245" width="466.6666666666667" height="429" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="2" filter="url(#shadow)"/><rect x="76" y="265" width="7" height="389" rx="3.5" fill="#174a8b"/><text x="110" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="110" dy="0">CAR</tspan></text><text x="110" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="110" dy="0">Cars</tspan></text><text x="110" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="110" dy="0">Sedan, SUV and other body values;</tspan><tspan x="110" dy="26.8">driveline, MPG and shared identification</tspan><tspan x="110" dy="26.8">fields.</tspan></text><rect x="110" y="492.26" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="124" y="517.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="124" dy="0">vehicle_type: car</tspan></text><rect x="110" y="540.26" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="124" y="565.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="124" dy="0">body · driveline · fuel</tspan></text></g><g class="diagram-card"><rect x="566.6666666666667" y="245" width="466.6666666666667" height="429" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="2" filter="url(#shadow)"/><rect x="566.6666666666667" y="265" width="7" height="389" rx="3.5" fill="#2874d7"/><text x="600.6666666666667" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="600.6666666666667" dy="0">ELECTRIC</tspan></text><text x="600.6666666666667" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="600.6666666666667" dy="0">Electric units</tspan></text><text x="600.6666666666667" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="600.6666666666667" dy="0">The same powertrain group works for</tspan><tspan x="600.6666666666667" dy="26.8">electric cars and motorcycles.</tspan></text><rect x="600.6666666666667" y="465.46000000000004" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="614.6666666666667" y="490.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="614.6666666666667" dy="0">electric_range_mi</tspan></text><rect x="600.6666666666667" y="513.46" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="614.6666666666667" y="538.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="614.6666666666667" dy="0">battery_kwh · charge_port</tspan></text></g><g class="diagram-card"><rect x="1057.3333333333335" y="245" width="466.6666666666667" height="429" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="2" filter="url(#shadow)"/><rect x="1057.3333333333335" y="265" width="7" height="389" rx="3.5" fill="#0f766e"/><text x="1091.3333333333335" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1091.3333333333335" dy="0">MOTORCYCLE</tspan></text><text x="1091.3333333333335" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1091.3333333333335" dy="0">Motorcycles</tspan></text><text x="1091.3333333333335" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1091.3333333333335" dy="0">Segment in body, displacement for</tspan><tspan x="1091.3333333333335" dy="26.8">combustion units and niche specs in</tspan><tspan x="1091.3333333333335" dy="26.8">other_attributes.</tspan></text><rect x="1091.3333333333335" y="492.26" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1105.3333333333335" y="517.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1105.3333333333335" dy="0">vehicle_type: motorcycle</tspan></text><rect x="1091.3333333333335" y="540.26" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1105.3333333333335" y="565.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1105.3333333333335" dy="0">displacement_cc</tspan></text></g>
