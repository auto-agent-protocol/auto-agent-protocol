  </defs>
  <rect width="1600" height="800" fill="url(#pageWash)"/>
  <circle cx="1550" cy="-30" r="240" fill="#eaf3ff" opacity="0.68"/>
  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">ONE INVENTORY CONTRACT</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">Cars, motorcycles and electric powertrains share one vocabulary</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">An optional vehicle_type selects class-specific details while common fields stay common.</tspan></text>
