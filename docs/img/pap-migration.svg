<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="pap-migration-title pap-migration-desc" aria-label="AAP 4.0 targets PAP 1.0. Every Session request adds Poppy-Version, extensions become lists with one entry per major version, one tasks endpoint replaces three fields, Companies accept ES256 and PS384, and a Session is found by client_id, sid and User ID.">
<title id="pap-migration-title">Five changes when a dealer moves to PAP 1.0.</title><desc id="pap-migration-desc">AAP 4.0 targets PAP 1.0. Every Session request adds Poppy-Version, extensions become lists with one entry per major version, one tasks endpoint replaces three fields, Companies accept ES256 and PS384, and a Session is found by client_id, sid and User ID. A domain publishes one poppy.json. PAP 0.3 agents need explicit AAP 3.2 configuration until they migrate.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP 0.3 TO PAP 1.0</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Five changes when a dealer moves to PAP 1.0.</text>
<rect x="196" y="192" width="440" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="416" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#52627a" text-anchor="middle" data-max-width="416">AAP 3.2 · PAP 0.3</text><rect x="712" y="192" width="440" height="36" rx="18" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="932" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="416">AAP 4.0 · PAP 1.0</text><text x="48" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="140">Version</text><rect x="196" y="246" width="440" height="60" rx="14" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/><text x="218" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="400">Poppy-Session only</text><path d="M646 276L702 276" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="692,282 702,276 692,270" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="246" width="440" height="60" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(730 262) scale(1.1666666666666667)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="774" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="360">+ Poppy-Version: 1.0</text><text x="48" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="140">Extensions</text><rect x="196" y="320" width="440" height="60" rx="14" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/><text x="218" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="400">One object per name</text><path d="M646 350L702 350" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="692,356 702,350 692,344" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="320" width="440" height="60" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(730 336) scale(1.1666666666666667)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="774" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="360">A list, one entry per major</text><text x="48" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="140">Tasks</text><rect x="196" y="394" width="440" height="60" rx="14" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/><text x="218" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="400">excluded_tasks, skill_index, feedback</text><path d="M646 424L702 424" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="692,430 702,424 692,418" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="394" width="440" height="60" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(730 410) scale(1.1666666666666667)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="774" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="360">One tasks.endpoint</text><text x="48" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="140">Keys</text><rect x="196" y="468" width="440" height="60" rx="14" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/><text x="218" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="400">PS384 recommended</text><path d="M646 498L702 498" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="692,504 702,498 692,492" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="468" width="440" height="60" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(730 484) scale(1.1666666666666667)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="774" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="360">ES256 and PS384 accepted</text><text x="48" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="140">Session</text><rect x="196" y="542" width="440" height="60" rx="14" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/><text x="218" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="400">Found by client_id + sid</text><path d="M646 572L702 572" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="692,578 702,572 692,566" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="542" width="440" height="60" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(730 558) scale(1.1666666666666667)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="774" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="360">client_id + sid + User ID</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">A domain publishes one poppy.json. PAP 0.3 agents need explicit AAP 3.2 configuration until they migrate.</text>
</svg>
