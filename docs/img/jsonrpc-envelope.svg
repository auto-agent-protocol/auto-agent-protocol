<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="JSON-RPC 2.0 carries one A2A operation. The request Message goes in; the response Message comes back under the same JSON-RPC id.">
  <title>JSON-RPC 2.0 carries one A2A operation</title>
  <desc>The request Message goes in; the response Message comes back under the same JSON-RPC id.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20364f" flood-opacity="0.07"/></filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#pageWash)"/>
  <circle cx="1550" cy="-30" r="240" fill="#eaf3ff" opacity="0.68"/>
  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">SOLE AAP BINDING</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">JSON-RPC 2.0 carries one A2A operation</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">The request Message goes in; the response Message comes back under the same JSON-RPC id.</tspan></text>
  <image href="data:image/svg+xml;base64," x="1406" y="28" width="88" height="88" aria-hidden="true"/>
  <line x1="726" y1="509.5" x2="874" y2="509.5" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 862 500.5 L 874 509.5 L 862 518.5" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="467.5" width="144" height="34" rx="17" fill="#ffffff" stroke="#c9dced"/><text x="800" y="491.5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="middle" letter-spacing="1.1"><tspan x="800" dy="0">same id</tspan></text><g class="diagram-card"><rect x="82" y="245" width="620" height="529" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="2" filter="url(#shadow)"/><rect x="82" y="265" width="7" height="489" rx="3.5" fill="#2874d7"/><text x="116" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="116" dy="0">REQUEST</tspan></text><text x="116" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="116" dy="0">SendMessage</tspan></text><text x="116" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="116" dy="0">The buyer sends an A2A Message with ROLE_USER and a</tspan><tspan x="116" dy="26.8">typed request DataPart.</tspan></text><rect x="116" y="465.46000000000004" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="130" y="490.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="130" dy="0">jsonrpc: 2.0</tspan></text><rect x="116" y="513.46" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="130" y="538.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="130" dy="0">id: 7</tspan></text><rect x="116" y="561.46" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="130" y="586.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="130" dy="0">method: SendMessage</tspan></text><rect x="116" y="609.46" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="130" y="634.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="130" dy="0">params.message.parts[].data</tspan></text></g><g class="diagram-card"><rect x="898" y="245" width="620" height="529" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="2" filter="url(#shadow)"/><rect x="898" y="265" width="7" height="489" rx="3.5" fill="#174a8b"/><text x="932" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="932" dy="0">RESPONSE</tspan></text><text x="932" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="932" dy="0">result.message</tspan></text><text x="932" y="389.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="932" dy="0">The dealer returns an A2A Message with ROLE_AGENT and</tspan><tspan x="932" dy="26.8">the corresponding typed response.</tspan></text><rect x="932" y="465.46000000000004" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="946" y="490.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="946" dy="0">jsonrpc: 2.0</tspan></text><rect x="932" y="513.46" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="946" y="538.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="946" dy="0">id: 7</tspan></text><rect x="932" y="561.46" width="552" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="946" y="586.9200000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="946" dy="0">result.message.parts[].data</tspan></text></g>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">No REST binding, streaming, tasks or push-notification surface is required by AAP.</tspan></text></g>
</svg>
