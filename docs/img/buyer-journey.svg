<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="buyer-journey-title buyer-journey-desc" aria-label="A buyer agent discovers a dealer, searches inventory, verifies one vehicle and submits an inquiry only after customer consent.">
