<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="credit-consent-title credit-consent-desc" aria-label="The applicant and any co-applicant each grant verbatim consent text, a soft or hard inquiry, contact channels and an optional expiry. Credit consent is not lead consent.">
<title id="credit-consent-title">Each applicant grants their own credit consent.</title><desc id="credit-consent-desc">The applicant and any co-applicant each grant verbatim consent text, a soft or hard inquiry, contact channels and an optional expiry. Credit consent is not lead consent. A hard inquiry is never made on a soft authorization. An invalid or expired grant returns INVALID_CONSENT.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">CREDIT CONSENT</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Each applicant grants their own credit consent.</text>
