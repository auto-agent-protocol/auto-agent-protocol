agreed</text><text x="76" y="496" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">expires_at</text><text x="304" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">Optional deadline</text><rect x="620" y="200" width="532" height="328" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(648 222) scale(1.8333333333333333)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4.5"/><path d="M3.5 22a8.5 8.5 0 0 1 17 0"/></g><text x="708" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="260">Co-applicant</text><rect x="988" y="226" width="140" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="1058" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="116">Joint only</text><path d="M648 290L1124 290" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="648" y="328" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">consent_text</text><text x="876" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">Verbatim text they saw</text><text x="648" y="370" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">authorized_inquiry</text><text x="876" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">soft or hard</text><text x="648" y="412" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">allowed_channels</text><text x="876" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">email · phone · sms</text><text x="648" y="454" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">granted_at</text><text x="876" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">When they agreed</text><text x="648" y="496" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="214">expires_at</text><text x="876" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="252">Optional deadline</text><rect x="48" y="548" width="1104" height="64" rx="20" fill="#fff4dc" stroke="#fff4dc" stroke-width="2"/><g transform="translate(74 562) scale(1.5)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></g><text x="128" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="250">Not lead consent.</text><text x="380" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="750">Lead consent, sign-in or an Operations approval never replaces it.</text>
