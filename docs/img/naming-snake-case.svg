<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">ONE SPELLING IN AAP 4.0</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">snake_case for every skill, type and tool.</text>
