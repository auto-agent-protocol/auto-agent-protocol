<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="naming-snake-case-title naming-snake-case-desc" aria-label="AAP 4.0 renames dotted identifiers to snake_case: skill id lead.submit becomes lead_submit, message type lead.submit.request becomes lead_submit_request, the error envelope aap.error becomes aap_error and the PAP path becomes /skills/lead_submit. The MCP tool name aap_lead_submit is unchanged and now matches the skill id.">
<title id="naming-snake-case-title">snake_case for every skill, type and tool.</title><desc id="naming-snake-case-desc">AAP 4.0 renames dotted identifiers to snake_case: skill id lead.submit becomes lead_submit, message type lead.submit.request becomes lead_submit_request, the error envelope aap.error becomes aap_error and the PAP path becomes /skills/lead_submit. The MCP tool name aap_lead_submit is unchanged and now matches the skill id. Field names, error codes and MCP tool names were already consistent. Payload fields keep their meaning.</desc>
