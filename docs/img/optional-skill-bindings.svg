<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="optional-skill-bindings-title optional-skill-bindings-desc" aria-label="trade_in.submit and credit_application.submit are called as the MCP tools aap_trade_in_submit and aap_credit_application_submit, as typed A2A DataParts for those skill ids in SendMessage, and as PAP POST requests to /skills/trade_in.submit and /skills/credit_application.submit with Poppy-Version.">
<title id="optional-skill-bindings-title">One request body. Three native calls.</title><desc id="optional-skill-bindings-desc">trade_in.submit and credit_application.submit are called as the MCP tools aap_trade_in_submit and aap_credit_application_submit, as typed A2A DataParts for those skill ids in SendMessage, and as PAP POST requests to /skills/trade_in.submit and /skills/credit_application.submit with Poppy-Version. Same payload, consent rules and idempotency key everywhere. Offer a skill on all three bindings or on none.</desc>
