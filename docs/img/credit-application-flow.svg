ze="18" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="306">approved</text><text x="818" y="508.3" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="306">conditionally_approved</text><text x="818" y="534.4" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="306">declined</text>
