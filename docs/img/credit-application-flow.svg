<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="credit-application-flow-title credit-application-flow-desc" aria-label="An agent reads the dealer's capabilities, collects only accepted data, records each applicant's consent and submits once with an idempotency key. The status reports the submission; a decision is reported separately.">
<title id="credit-application-flow-title">Check capabilities. Get consent. Submit once.</title><desc id="credit-application-flow-desc">An agent reads the dealer's capabilities, collects only accepted data, records each applicant's consent and submits once with an idempotency key. The status reports the submission; a decision is reported separately. Rejected means no application and no inquiry. A declined decision is not the creditor's adverse-action notice.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">CREDIT APPLICATION</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Check capabilities. Get consent. Submit once.</text>
