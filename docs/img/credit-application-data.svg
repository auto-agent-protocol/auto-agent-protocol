<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="credit-application-data-title credit-application-data-desc" aria-label="Identity, contact, residence, employment and income, financing and vehicles make up a credit application. national_id, date_of_birth and drivers_license are sensitive and never echoed.">
<title id="credit-application-data-title">Six data groups. Three fields never echoed.</title><desc id="credit-application-data-desc">Identity, contact, residence, employment and income, financing and vehicles make up a credit application. national_id, date_of_birth and drivers_license are sensitive and never echoed. Read capabilities before collecting an identifier. Never echo the sensitive fields anywhere.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">CREDIT APPLICATION DATA</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Six data groups. Three fields never echoed.</text>
<rect x="48" y="206" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(70 228) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4.5"/><path d="M3.5 22a8.5 8.5 0 0 1 17 0"/></g><text x="70" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Identity</text><text x="70" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Name, suffix</text><text x="70" y="362.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Marital status</text><rect x="291" y="206" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(313 228) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="15" rx="3"/><path d="m3 7 9 7 9-7"/></g><text x="313" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Contact</text><text x="313" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Email or phone</text><text x="313" y="362.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">For each applicant</text><rect x="534" y="206" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(556 228) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></g><text x="556" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Residence</text><text x="556" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Address, housing</text><text x="556" y="362.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Months at address</text><rect x="48" y="404" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(70 426) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3a6 6 0 0 0-7 8L2 18a3 3 0 0 0 4 4l7-6a6 6 0 0 0 8-7l-5 3-4-4z"/></g><text x="70" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Employment</text><text x="70" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Status, employer</text><text x="70" y="560.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Monthly income</text><rect x="291" y="404" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(313 426) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="313" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Financing</text><text x="313" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Finance or lease</text><text x="313" y="560.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Down payment, term</text><rect x="534" y="404" width="226" height="180" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(556 426) scale(1.5)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 3-7h12l3 7v8H3zM3 11h18M7 4l-1 7M17 4l1 7M6 15h2M16 15h2M6 19v3M18 19v3"/></g><text x="556" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="186">Vehicles</text><text x="556" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Vehicle of interest</text><text x="556" y="560.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="196">Trade-in, payoff</text><rect x="790" y="206" width="362" height="378" rx="20" fill="#fff4dc" stroke="#93600b" stroke-width="2"/><g transform="translate(818 230) scale(1.8333333333333333)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></g><text x="878" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="650" fill="#93600b" text-anchor="start" data-max-width="250">Sensitive</text><text x="818" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="306">Never echoed</text><rect x="818" y="340" width="306" height="40" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="838" y="367" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="270">national_id</text><rect x="818" y="392" width="306" height="40" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="838" y="419" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="270">date_of_birth</text><rect x="818" y="444" width="306" height="40" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="838" y="471" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="270">drivers_license</text><text x="818" y="528" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="306">Not in responses, errors,</text><text x="818" y="554.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="306">logs or URLs</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Read capabilities before collecting an identifier. Never echo the sensitive fields anywhere.</text>
