<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="datapart-anatomy-title datapart-anatomy-desc" aria-label="An A2A Message has a messageId, role and parts. Its DataPart contains the typed AAP request in data.">
<title id="datapart-anatomy-title">A typed payload inside an A2A message.</title><desc id="datapart-anatomy-desc">An A2A Message has a messageId, role and parts. Its DataPart contains the typed AAP request in data. Use A2A 1.0 ProtoJSON: ROLE_USER or ROLE_AGENT, with no invented kind field.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">A2A PAYLOAD</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">A typed payload inside an A2A message.</text>
<rect x="48" y="204" width="1104" height="410" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="80" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="1000">A2A Message</text><text x="80" y="291" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1000">messageId  ·  role: ROLE_USER  ·  parts[]</text><rect x="106" y="322" width="996" height="246" rx="20" fill="#eaf2ff" stroke="#2874d7" stroke-width="2"/><text x="140" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="650" fill="#1855a6" text-anchor="start" data-max-width="900">DataPart</text><rect x="164" y="396" width="884" height="126" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="192" y="439" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="828">data: { type: &quot;inventory.search.request&quot;,</text><text x="192" y="483" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="828">        filters: { make: [&quot;Toyota&quot;] } }</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Use A2A 1.0 ProtoJSON: ROLE_USER or ROLE_AGENT, with no invented kind field.</text>
</svg>
