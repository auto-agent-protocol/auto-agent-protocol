<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="optional-skills-title optional-skills-desc" aria-label="Dealer information, facets, search, vehicle detail and lead submission are core. trade_in.submit and credit_application.submit are optional, each declared with a capabilities object on MCP, A2A and PAP.">
<title id="optional-skills-title">Five core skills. Two optional skills.</title><desc id="optional-skills-desc">Dealer information, facets, search, vehicle detail and lead submission are core. trade_in.submit and credit_application.submit are optional, each declared with a capabilities object on MCP, A2A and PAP. Declare an optional skill only when it works, identically on all three bindings with the same capabilities object.</desc>
