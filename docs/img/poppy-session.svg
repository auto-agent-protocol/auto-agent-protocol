<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-session-title poppy-session-desc" aria-label="An identity key signs a delegation for an ES256 key. The personal agent signs each API request with that delegated key. The Company verifies the delegation, request and client_id + sid continuity.">
<title id="poppy-session-title">Stable Sessions. Rotating delegated keys.</title><desc id="poppy-session-desc">An identity key signs a delegation for an ES256 key. The personal agent signs each API request with that delegated key. The Company verifies the delegation, request and client_id + sid continuity. The SID and User ID stay stable while delegated keys rotate. Signed-out shopping needs no OAuth token.</desc>
