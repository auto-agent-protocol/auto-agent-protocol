<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Stable Sessions. Rotating delegated keys.</text>
<rect x="48" y="198" width="220" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="158" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="196">Identity key</text><path d="M158 252L158 611" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><rect x="490" y="198" width="220" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="600" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="196">Personal agent</text><path d="M600 252L600 611" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><rect x="932" y="198" width="220" height="36" rx="18" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="1042" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="196">Automotive API</text><path d="M1042 252L1042 611" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><text x="193" y="293" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="407">Sign a short-lived delegation</text><path d="M158 315L600 315" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="590,321 600,315 590,309" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#12213a" text-anchor="start" data-max-width="500">Fresh delegated Session JWT</text><path d="M600 387L1042 387" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="1032,393 1042,387 1032,381" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="437" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="500">Verify delegation + request binding</text><text x="635" y="509" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#087d70" text-anchor="start" data-max-width="500">Typed automotive result</text><path d="M1042 531L600 531" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="610,525 600,531 610,537" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="193" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#087d70" text-anchor="start" data-max-width="900">client_id + sid identifies the Session; keys may rotate</text>
