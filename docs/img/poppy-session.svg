roke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="193" y="437" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#1855a6" text-anchor="start" data-max-width="830">DPoP token · no scope field</text><path d="M600 459L158 459" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="168,453 158,459 168,465" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="193" y="509" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#087d70" text-anchor="start" data-max-width="830">AAP request + token + fresh DPoP</text><path d="M158 531L1042 531" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="1032,537 1042,531 1032,525" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="632" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#087d70" text-anchor="start" data-max-width="370">Typed automotive result</text><path d="M1042 603L158 603" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round"/><polyline points="168,597 158,603 168,609" fill="none" stroke="#087d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
