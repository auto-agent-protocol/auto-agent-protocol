<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-session-title poppy-session-desc" aria-label="After verifying discovery, the personal agent creates a new Session Key, signs client and Session assertions, receives a DPoP token without a scope field and calls the automotive API. The key thumbprint identifies the Session.">
<title id="poppy-session-title">One Session. One proof key.</title><desc id="poppy-session-desc">After verifying discovery, the personal agent creates a new Session Key, signs client and Session assertions, receives a DPoP token without a scope field and calls the automotive API. The key thumbprint identifies the Session. Renew with the same key. A new key starts a new Session. Guest shopping needs no account.</desc>
