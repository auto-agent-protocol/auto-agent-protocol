<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="trade-in-outcomes-title trade-in-outcomes-desc" aria-label="valued carries an amount, a range or both, as an estimate or an offer with an expiry. received means the dealer follows up later. rejected means nothing was recorded.">
<title id="trade-in-outcomes-title">Three outcomes. Only valued carries a value.</title><desc id="trade-in-outcomes-desc">valued carries an amount, a range or both, as an estimate or an offer with an expiry. received means the dealer follows up later. rejected means nothing was recorded. An estimate is non-binding. Even an offer depends on the vehicle matching its description at inspection.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">TRADE-IN OUTCOMES</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Three outcomes. Only valued carries a value.</text>
<rect x="48" y="200" width="348" height="340" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(184 230) scale(3.1666666666666665)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="222" y="368" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="650" fill="#087d70" text-anchor="middle" data-max-width="300">valued</text><text x="222" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Amount, range or both</text><text x="222" y="450.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Estimate or offer</text><text x="222" y="480.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">An offer has expires_at</text><rect x="426" y="200" width="348" height="340" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(562 230) scale(3.1666666666666665)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></g><text x="600" y="368" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="650" fill="#1855a6" text-anchor="middle" data-max-width="300">received</text><text x="600" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">No valuation yet</text><text x="600" y="450.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Dealer follows up later</text><text x="600" y="480.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Needs consented contact</text><rect x="804" y="200" width="348" height="340" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(940 230) scale(3.1666666666666665)" fill="none" stroke="#52627a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></g><text x="978" y="368" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="650" fill="#52627a" text-anchor="middle" data-max-width="300">rejected</text><text x="978" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Not accepted</text><text x="978" y="450.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">Nothing was recorded</text><text x="978" y="480.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="304">No valuation</text><rect x="48" y="568" width="1104" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="600" y="592" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="1080">Retry with the same idempotency key: original result, replayed: true</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">An estimate is non-binding. Even an offer depends on the vehicle matching its description at inspection.</text>
</svg>
