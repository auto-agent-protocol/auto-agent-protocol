<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-label="From an integration mesh to one open profile. A common contract removes repeated pair-by-pair protocol work.">
  <title>From an integration mesh to one open profile</title>
  <desc>A common contract removes repeated pair-by-pair protocol work.</desc>
