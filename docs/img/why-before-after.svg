  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">WHY AAP</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">From an integration mesh to one open profile</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">A common contract removes repeated pair-by-pair protocol work.</tspan></text>
  <image href="data:image/svg+xml;base64," x="1406" y="28" width="88" height="88" aria-hidden="true"/>
  <rect x="70" y="245" width="700" height="729" rx="28" fill="#ffffff" stroke="#c9dced" stroke-width="2"/>
      <text x="104" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#52657c" text-anchor="start" letter-spacing="2"><tspan x="104" dy="0">BEFORE</tspan></text>
      <g class="diagram-card"><rect x="92" y="315" width="656" height="201" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="126" y="345" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="126" dy="0">Buyer agents</tspan></text><text x="126" y="380.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="126" dy="0">Agent 1 · Agent 2 · Agent 3</tspan></text></g><g class="diagram-card"><rect x="92" y="532" width="656" height="201" rx="24" fill="#eef3f8" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="126" y="562" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="126" dy="0">Custom APIs</tspan></text><text x="126" y="597.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="126" dy="0">Every pair negotiates discovery, fields, errors and transport again.</tspan></text></g><g class="diagram-card"><rect x="92" y="749" width="656" height="201" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="126" y="779" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="126" dy="0">Dealerships</tspan></text><text x="126" y="814.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="126" dy="0">Dealer A · Dealer B · Dealer C</tspan></text></g><rect x="830" y="245" width="700" height="729" rx="28" fill="#ffffff" stroke="#c9dced" stroke-width="2"/>
      <text x="864" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2"><tspan x="864" dy="0">AFTER</tspan></text>
      <g class="diagram-card"><rect x="852" y="315" width="656" height="201" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="886" y="345" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="886" dy="0">Any A2A client</tspan></text><text x="886" y="380.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="886" dy="0">One discovery and message model</tspan></text></g><g class="diagram-card"><rect x="852" y="532" width="656" height="201" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="3" filter="url(#shadow)"/><text x="886" y="562" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="886" dy="0">AAP profile</tspan></text><text x="886" y="597.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="886" dy="0">Five typed automotive skills</tspan></text><rect x="886" y="626.88" width="588" height="30" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="900" y="646.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="900" dy="0">Agent Card</tspan></text><rect x="886" y="662.88" width="588" height="30" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="900" y="682.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="900" dy="0">SendMessage</tspan></text></g><g class="diagram-card"><rect x="852" y="749" width="656" height="201" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="3" filter="url(#shadow)"/><text x="886" y="779" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="886" dy="0">Any AAP dealer</tspan></text><text x="886" y="814.12" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="886" dy="0">One public contract on its domain</tspan></text></g><line x1="784" y1="609.5" x2="816" y2="609.5" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 804 600.5 L 816 609.5 L 804 618.5" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g><rect x="72" y="1014" width="1456" height="1" fill="#c9dced"/><text x="800" y="1057" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">Open interoperability replaces N×M custom integration work.</tspan></text></g>
