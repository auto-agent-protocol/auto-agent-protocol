<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-tasks-title poppy-tasks-desc" aria-label="GET tasks.endpoint with the Session header and no access token returns excluded tasks, the skill index and the feedback endpoint for that Session.">
<title id="poppy-tasks-title">One tasks endpoint, answered per Session.</title><desc id="poppy-tasks-desc">GET tasks.endpoint with the Session header and no access token returns excluded tasks, the skill index and the feedback endpoint for that Session. Reuse the response only within its Session. PAP skill_index lists Agent Skills artifacts, not AAP skills.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP 1.0 TASK COVERAGE</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">One tasks endpoint, answered per Session.</text>
<rect x="48" y="200" width="392" height="360" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(76 244) scale(2.1666666666666665)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="76" y="350" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="336">GET tasks.endpoint</text><text x="76" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="336">Poppy-Session header</text><text x="76" y="434.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#12213a" text-anchor="start" data-max-width="336">Poppy-Version: 1.0</text><g transform="translate(76 476) scale(1.0833333333333333)" fill="none" stroke="#52627a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></g><text x="112" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="300">No access token</text><path d="M446 380L508 380" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round"/><polyline points="498,386 508,380 498,374" fill="none" stroke="#2874d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="200" width="638" height="360" rx="20" fill="#eaf2ff" stroke="#2874d7" stroke-width="2"/><rect x="538" y="220" width="590" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="566" y="260" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="534">excluded_tasks</text><text x="566" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="534">Tasks not offered, with alternatives</text><rect x="538" y="332" width="590" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="566" y="372" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="534">skill_index</text><text x="566" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="534">Agent Skills index, not AAP skills</text><rect x="538" y="444" width="590" height="96" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="566" y="484" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="534">feedback.endpoint</text><text x="566" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="534">Report a task the agent could not do</text><rect x="48" y="578" width="1104" height="36" rx="18" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="600" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="1080">Per Session · Cache-Control: private or no-store when responses differ</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Reuse the response only within its Session. PAP skill_index lists Agent Skills artifacts, not AAP skills.</text>
