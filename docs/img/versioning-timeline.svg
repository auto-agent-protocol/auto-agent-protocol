<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Edit latest; freeze only reviewed releases. The working contract stays readable in place while every published version remains immutable.">
  <title>Edit latest; freeze only reviewed releases</title>
  <desc>The working contract stays readable in place while every published version remains immutable.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20364f" flood-opacity="0.07"/></filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#pageWash)"/>
  <circle cx="1550" cy="-30" r="240" fill="#eaf3ff" opacity="0.68"/>
  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">RELEASE MODEL</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">Edit latest; freeze only reviewed releases</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">The working contract stays readable in place while every published version remains immutable.</tspan></text>
  <image href="data:image/svg+xml;base64," x="1406" y="28" width="88" height="88" aria-hidden="true"/>
  <line x1="82" y1="338" x2="1518" y2="338" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><circle cx="82" cy="338" r="12" fill="#ffffff" stroke="#2874d7" stroke-width="5"/><circle cx="560.6666666666667" cy="338" r="12" fill="#ffffff" stroke="#2874d7" stroke-width="5"/><circle cx="1039.3333333333335" cy="338" r="12" fill="#ffffff" stroke="#2874d7" stroke-width="5"/><circle cx="1518" cy="338" r="12" fill="#ffffff" stroke="#2874d7" stroke-width="5"/><g class="diagram-card"><rect x="55" y="405" width="330" height="344" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="425" width="7" height="304" rx="3.5" fill="#2874d7"/><text x="81.4" y="449" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="81.4" dy="0">WORK</tspan></text><text x="81.4" y="491" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="81.4" dy="0">spec/latest + docs</tspan></text><text x="81.4" y="545.84" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="81.4" dy="0">Review normal diffs in the</tspan><tspan x="81.4" dy="26.8">editable contract and</tspan><tspan x="81.4" dy="26.8">documentation.</tspan></text></g><g class="diagram-card"><rect x="395.66666666666674" y="405" width="330" height="344" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="2" filter="url(#shadow)"/><rect x="395.66666666666674" y="425" width="7" height="304" rx="3.5" fill="#174a8b"/><text x="422.0666666666667" y="449" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="422.0666666666667" dy="0">VERIFY</tspan></text><text x="422.0666666666667" y="491" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="422.0666666666667" dy="0">Release checks</tspan></text><text x="422.0666666666667" y="545.84" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="422.0666666666667" dy="0">Validate schemas, examples,</tspan><tspan x="422.0666666666667" dy="26.8">compatibility, artifacts and</tspan><tspan x="422.0666666666667" dy="26.8">image sources.</tspan></text></g><g class="diagram-card"><rect x="874.3333333333335" y="405" width="330" height="344" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="2" filter="url(#shadow)"/><rect x="874.3333333333335" y="425" width="7" height="304" rx="3.5" fill="#174a8b"/><text x="900.7333333333335" y="449" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="900.7333333333335" dy="0">SNAPSHOT</tspan></text><text x="900.7333333333335" y="491" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="900.7333333333335" dy="0">vN.N.0</tspan></text><text x="900.7333333333335" y="545.84" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="900.7333333333335" dy="0">Copy the reviewed spec, docs</tspan><tspan x="900.7333333333335" dy="26.8">and diagrams into a frozen</tspan><tspan x="900.7333333333335" dy="26.8">version.</tspan></text></g><g class="diagram-card"><rect x="1215" y="405" width="330" height="344" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="2" filter="url(#shadow)"/><rect x="1215" y="425" width="7" height="304" rx="3.5" fill="#0f766e"/><text x="1241.4" y="449" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1241.4" dy="0">PUBLISH</tspan></text><text x="1241.4" y="491" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1241.4" dy="0">Public latest</tspan></text><text x="1241.4" y="545.84" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1241.4" dy="0">Point the latest alias at the</tspan><tspan x="1241.4" dy="26.8">newest approved release.</tspan></text></g>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">Historical schema URLs, documentation and artwork never change after release.</tspan></text></g>
</svg>
