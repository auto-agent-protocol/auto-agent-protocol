<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-compliance-map-title poppy-compliance-map-desc" aria-label="Discovery, versions, Sessions and APIs are required. Sign-in, browser join, conversations, task coverage and Operations are required only when advertised. Keys, secrets and destinations are client obligations, not dealer requirements.">
<title id="poppy-compliance-map-title">What a dealer implements from PAP 1.0.</title><desc id="poppy-compliance-map-desc">Discovery, versions, Sessions and APIs are required. Sign-in, browser join, conversations, task coverage and Operations are required only when advertised. Keys, secrets and destinations are client obligations, not dealer requirements. Advertise an optional PAP feature only when it follows the complete upstream rules.</desc>
