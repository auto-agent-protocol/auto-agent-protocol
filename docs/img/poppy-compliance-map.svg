ions</text><g transform="translate(830 278) scale(1.0833333333333333)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="870" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="258">Keys</text><text x="870" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="258">Protect identity keys</text><g transform="translate(830 340) scale(1.0833333333333333)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="870" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="258">Secrets</text><text x="870" y="387" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="258">Never in model context</text><g transform="translate(830 402) scale(1.0833333333333333)" fill="none" stroke="#93600b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="870" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="258">Destinations</text><text x="870" y="449" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="258">Check audience + host</text><text x="978" y="510" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#93600b" text-anchor="middle" data-max-width="300">Not a dealer requirement</text>
