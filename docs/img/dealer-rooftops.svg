o · phones · schedules ·</tspan><tspan x="1091.3333333333335" dy="26.8">timezone · EV sales · service</tspan></text><rect x="1091.3333333333335" y="465.46000000000004" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1105.3333333333335" y="490.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1105.3333333333335" dy="0">fees omitted · unknown</tspan></text></g>
