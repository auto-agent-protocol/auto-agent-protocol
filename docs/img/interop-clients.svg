.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="875" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="490">One AAP contract</text><text x="875" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="490">Real HTTP envelopes</text><text x="875" y="481.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="490">Typed requests + responses</text><text x="875" y="517.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="490">Actionable errors</text><text x="875" y="553.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="490">Equivalent business behavior</text>
