<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="interop-clients-title interop-clients-desc" aria-label="Current and legacy MCP clients, A2A clients and PAP authenticated requests must reach the same typed automotive contract.">
<title id="interop-clients-title">Verify the bytes that clients actually send.</title><desc id="interop-clients-desc">Current and legacy MCP clients, A2A clients and PAP authenticated requests must reach the same typed automotive contract. Valid schemas are one check. Deployed discovery, authentication and behavior need runtime checks.</desc>
