<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="poppy-request-headers-title poppy-request-headers-desc" aria-label="A PAP 1.0 API request carries Poppy-Session and Poppy-Version. Poppy-Extensions is added when it uses extensions, Authorization only when signed in, and Poppy-Approval only when it approves an Operation.">
<title id="poppy-request-headers-title">Two required headers. Three when they apply.</title><desc id="poppy-request-headers-desc">A PAP 1.0 API request carries Poppy-Session and Poppy-Version. Poppy-Extensions is added when it uses extensions, Authorization only when signed in, and Poppy-Approval only when it approves an Operation. Keep the version headers fixed for a Session. Discovery and OAuth requests omit them.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">PAP 1.0 REQUEST</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Two required headers. Three when they apply.</text>
<text x="48" y="206" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#12213a" text-anchor="start" data-max-width="1000">POST /skills/inventory.search</text><rect x="48" y="226" width="1104" height="64" rx="14" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="76" y="266" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#087d70" text-anchor="start" data-max-width="270">Poppy-Session</text><text x="360" y="266" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="500">eyJ0eXAiOiJwb3BweS1zZXNz…</text><rect x="880" y="240" width="248" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="1004" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="224">Required</text><rect x="48" y="304" width="1104" height="64" rx="14" fill="#e6f5f1" stroke="#e6f5f1" stroke-width="2"/><text x="76" y="344" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#087d70" text-anchor="start" data-max-width="270">Poppy-Version</text><text x="360" y="344" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="500">1.0</text><rect x="880" y="318" width="248" height="36" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="1004" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#087d70" text-anchor="middle" data-max-width="224">Required</text><rect x="48" y="382" width="1104" height="64" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="76" y="422" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="270">Poppy-Extensions</text><text x="360" y="422" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="500">&quot;autoagentprotocol.org/aap&quot;;v=&quot;1&quot;</text><rect x="880" y="396" width="248" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="1004" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="224">With extensions</text><rect x="48" y="460" width="1104" height="64" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="76" y="500" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="270">Authorization</text><text x="360" y="500" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="500">Bearer eyJhbGciOi…</text><rect x="880" y="474" width="248" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="1004" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="224">Signed in only</text><rect x="48" y="538" width="1104" height="64" rx="14" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><text x="76" y="578" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="600" fill="#1855a6" text-anchor="start" data-max-width="270">Poppy-Approval</text><text x="360" y="578" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="500">operation_id=&quot;…&quot;, approver=&quot;user&quot;</text><rect x="880" y="552" width="248" height="36" rx="18" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="2"/><text x="1004" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#1855a6" text-anchor="middle" data-max-width="224">With Operations</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Keep the version headers fixed for a Session. Discovery and OAuth requests omit them.</text>
</svg>
