ple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="600.6666666666667" dy="0">@autoagentprotocol/</tspan><tspan x="600.6666666666667" dy="38.86">schemas</tspan></text><text x="600.6666666666667" y="428.72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="600.6666666666667" dy="0">Raw JSON Schema 2020-12 documents as</tspan><tspan x="600.6666666666667" dy="26.8">importable modules.</tspan></text><rect x="600.6666666666667" y="504.32000000000005" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="614.6666666666667" y="529.7800000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="614.6666666666667" dy="0">{ $schema, $id, … }</tspan></text></g><g class="diagram-card"><rect x="1057.3333333333335" y="245" width="466.6666666666667" height="529" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="2" filter="url(#shadow)"/><rect x="1057.3333333333335" y="265" width="7" height="489" rx="3.5" fill="#0f766e"/><text x="1091.3333333333335" y="289" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1091.3333333333335" dy="0">VALIDATOR</tspan></text><text x="1091.3333333333335" y="331" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1091.3333333333335" dy="0">@autoagentprotocol/</tspan><tspan x="1091.3333333333335" dy="38.86">validator</tspan></text><text x="1091.3333333333335" y="428.72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1091.3333333333335" dy="0">Ajv-based validation with every</tspan><tspan x="1091.3333333333335" dy="26.8">actionable error returned together.</tspan></text><rect x="1091.3333333333335" y="504.32000000000005" width="398.6666666666667" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1105.3333333333335" y="529.7800000000001" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1105.3333333333335" dy="0">validate(value) → errors[]</tspan></text></g>
