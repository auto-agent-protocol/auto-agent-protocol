<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="trade-in-valuation-title trade-in-valuation-desc" aria-label="Year, make, model, condition and mileage describe the vehicle. Without customer and consent the request is an anonymous estimate; with them the dealer may follow up. A valued response carries an amount or a range.">
<title id="trade-in-valuation-title">Value a trade-in, with or without contact.</title><desc id="trade-in-valuation-desc">Year, make, model, condition and mileage describe the vehicle. Without customer and consent the request is an anonymous estimate; with them the dealer may follow up. A valued response carries an amount or a range. A dealer that requires contact answers an anonymous request with CONTACT_CONSENT_REQUIRED.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">TRADE-IN VALUATION</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">Value a trade-in, with or without contact.</text>
