<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="trade-in-valuation-title trade-in-valuation-desc" aria-label="Year, make, model, condition and mileage describe the vehicle. Customer and consent are required, as for a lead, so the dealership receives a first-time trade-in like a regular lead. The dealer answers valued with an amount or a range, or received and follows up.">
<title id="trade-in-valuation-title">One trade-in submission. A value or a follow-up.</title><desc id="trade-in-valuation-desc">Year, make, model, condition and mileage describe the vehicle. Customer and consent are required, as for a lead, so the dealership receives a first-time trade-in like a regular lead. The dealer answers valued with an amount or a range, or received and follows up. Same customer and consent blocks as a lead. Only this tool returns a valuation; a lead never does.</desc>
<rect x="1" y="1" width="1198" height="758" rx="28" fill="#f5f7fb" stroke="#d8e1ed" stroke-width="2"/>
<text x="48" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1855a6" text-anchor="start" data-max-width="1000">TRADE-IN VALUATION</text><image href="data:image/svg+xml;base64," x="1104" y="26" width="44" height="44"/>
<text x="48" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#12213a" text-anchor="start" data-max-width="1104">One trade-in submission. A value or a follow-up.</text>
<rect x="48" y="204" width="330" height="196" rx="20" fill="#ffffff" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(72 226) scale(1.8333333333333333)" fill="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 3-7h12l3 7v8H3zM3 11h18M7 4l-1 7M17 4l1 7M6 15h2M16 15h2M6 19v3M18 19v3"/></g><text x="128" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="236">Vehicle facts</text><text x="72" y="312" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#1855a6" text-anchor="start" data-max-width="290">year · make · model</text><text x="72" y="339.55" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#1855a6" text-anchor="start" data-max-width="290">condition · mileage</text><text x="72" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52627a" text-anchor="start" data-max-width="290">Other details optional</text><rect x="48" y="416" width="330" height="196" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(72 438) scale(1.8333333333333333)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="128" y="468" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="236">Customer + consent</text><text x="72" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="290">Required, same as a lead</text><text x="72" y="551.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="290">scope: trade_in_submission</text><path d="M378 302C415 302 415 408 452 408" fill=