="none" stroke="#2874d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></g><text x="860" y="468" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="650" fill="#1855a6" text-anchor="start" data-max-width="270">received</text><text x="800" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">Dealer follows up</text><text x="800" y="551.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">Dealer delivering to a CRM</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">Same customer and consent blocks as a lead. Only this tool returns a valuation; a lead never does.</text>
