l="#12213a" text-anchor="start" data-max-width="284">Anonymous estimate</text><text x="444" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">No customer or consent</text><text x="444" y="337.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">Dealer stores no contact data</text><text x="444" y="365.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">No follow-up</text><rect x="420" y="420" width="384" height="180" rx="20" fill="#e6f5f1" stroke="#d8e1ed" stroke-width="2"/><g transform="translate(444 442) scale(1.8333333333333333)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6zM7 12l3 3 7-7"/></g><text x="506" y="474" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="650" fill="#12213a" text-anchor="start" data-max-width="284">Contact + consent</text><text x="444" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">customer + consent together</text><text x="444" y="547.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">scope: trade_in_submission</text><text x="444" y="575.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="336">Dealer may follow up</text><path d="M804 300C842 300 842 405 880 405" fill="none" stroke="#2874d7" stroke-width="3"/><path d="M804 510C842 510 842 405 880 405" fill="none" stroke="#087d70" stroke-width="3"/><rect x="880" y="290" width="272" height="230" rx="20" fill="#eaf2ff" stroke="#2874d7" stroke-width="2"/><g transform="translate(990 312) scale(2.1666666666666665)" fill="none" stroke="#087d70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="1016" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="650" fill="#12213a" text-anchor="middle" data-max-width="240">Valuation</text><text x="1016" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="240">Amount or range</text><text x="1016" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="240">Estimate or offer</text><text x="1016" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="middle" data-max-width="240">When status is valued</text>
<path d="M48 655L1152 655" fill="none" stroke="#d8e1ed" stroke-width="3" stroke-linecap="round"/><text x="48" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" data-max-width="1104">A dealer that requires contact answers an anonymous request with CONTACT_CONSENT_REQUIRED.</text>
