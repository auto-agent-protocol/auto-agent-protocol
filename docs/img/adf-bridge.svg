<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AAP leads map field-by-field into ADF/XML. The protocol modernizes agent exchange without forcing dealerships to replace existing CRM ingestion.">
  <title>AAP leads map field-by-field into ADF/XML</title>
  <desc>The protocol modernizes agent exchange without forcing dealerships to replace existing CRM ingestion.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#20364f" flood-opacity="0.07"/></filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#pageWash)"/>
  <circle cx="1550" cy="-30" r="240" fill="#eaf3ff" opacity="0.68"/>
  <circle cx="1510" cy="-60" r="150" fill="#dbeafe" opacity="0.45"/>
  <text x="88" y="66" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="2.4"><tspan x="88" dy="0">LEGACY CRM BRIDGE</tspan></text>
  <text x="88" y="123" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="780" fill="#102a43" text-anchor="start"><tspan x="88" dy="0">AAP leads map field-by-field into ADF/XML</tspan></text>
  <text x="88" y="180" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="88" dy="0">The protocol modernizes agent exchange without forcing dealerships to replace existing CRM ingestion.</tspan></text>
  <image href="data:image/svg+xml;base64," x="1406" y="28" width="88" height="88" aria-hidden="true"/>
  <g class="diagram-card"><rect x="76" y="250" width="464" height="524" rx="24" fill="#eaf3ff" stroke="#8db8e8" stroke-width="2" filter="url(#shadow)"/><rect x="76" y="270" width="7" height="484" rx="3.5" fill="#2874d7"/><text x="110" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#2874d7" text-anchor="start" letter-spacing="1.8"><tspan x="110" dy="0">01</tspan></text><text x="110" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="110" dy="0">AAP lead.submit</tspan></text><text x="110" y="394.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="110" dy="0">Typed JSON with source agent, consent,</tspan><tspan x="110" dy="26.8">customer and optional vehicle context.</tspan></text><rect x="110" y="470.46000000000004" width="396" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="124" y="495.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="124" dy="0">lead.submit.request</tspan></text></g><line x1="546" y1="512" x2="562" y2="512" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 550 503 L 562 512 L 550 521" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="diagram-card"><rect x="568" y="250" width="464" height="524" rx="24" fill="#ffffff" stroke="#c9dced" stroke-width="2" filter="url(#shadow)"/><rect x="568" y="270" width="7" height="484" rx="3.5" fill="#174a8b"/><text x="602" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#174a8b" text-anchor="start" letter-spacing="1.8"><tspan x="602" dy="0">02</tspan></text><text x="602" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="602" dy="0">Deterministic mapping</tspan></text><text x="602" y="394.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="602" dy="0">Customer name, email, vehicle VIN,</tspan><tspan x="602" dy="26.8">provider and vendor map to known ADF</tspan><tspan x="602" dy="26.8">fields.</tspan></text><rect x="602" y="497.26" width="396" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="616" y="522.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="616" dy="0">JSON → ADF/XML</tspan></text></g><line x1="1038" y1="512" x2="1054" y2="512" stroke="#8db8e8" stroke-width="3" stroke-linecap="round"/><path d="M 1042 503 L 1054 512 L 1042 521" fill="none" stroke="#8db8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="diagram-card"><rect x="1060" y="250" width="464" height="524" rx="24" fill="#e7f7f5" stroke="#7fc8c1" stroke-width="2" filter="url(#shadow)"/><rect x="1060" y="270" width="7" height="484" rx="3.5" fill="#0f766e"/><text x="1094" y="294" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="start" letter-spacing="1.8"><tspan x="1094" dy="0">03</tspan></text><text x="1094" y="336" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" fill="#102a43" text-anchor="start"><tspan x="1094" dy="0">Dealer CRM</tspan></text><text x="1094" y="394.86" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start"><tspan x="1094" dy="0">The existing 25-year-old lead pipeline</tspan><tspan x="1094" dy="26.8">ingests the familiar ADF document.</tspan></text><rect x="1094" y="470.46000000000004" width="396" height="38" rx="9" fill="#f7fbff" stroke="#c9dced"/><text x="1108" y="495.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#174a8b" text-anchor="start"><tspan x="1108" dy="0">&lt;adf&gt;&lt;prospect&gt;…</tspan></text></g>
  <g><rect x="72" y="814" width="1456" height="1" fill="#c9dced"/><text x="800" y="857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#174a8b" text-anchor="middle"><tspan x="800" dy="0">Consent remains an AAP requirement even when the destination format is legacy ADF/XML.</tspan></text></g>
</svg>
