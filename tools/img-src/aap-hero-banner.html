<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 600px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f4efe6;
    background-image: radial-gradient(#e1d9c8 1.6px, transparent 1.6px);
    background-size: 56px 56px;
    color: #26231c;
    position: relative;
  }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .left {
    position: absolute;
    left: 72px;
    top: 78px;
    width: 720px;
  }
  .tag {
    display: inline-block;
    background: #dcebe7;
    color: #0a463f;
    font-weight: 700;
    font-size: 20px;
    padding: 11px 26px;
    border-radius: 999px;
    letter-spacing: .04em;
    box-shadow: 0 6px 16px rgba(38,35,28,.06);
  }
  h1 {
    margin-top: 28px;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -1.6px;
    line-height: 1.05;
    color: #26231c;
  }
  h1 .accent { color: #0e5a52; }
  .subtitle {
    margin-top: 22px;
    font-size: 30px;
    color: #4a4338;
    font-weight: 600;
    line-height: 1.3;
    max-width: 640px;
  }
  .pills {
    margin-top: 36px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .pill {
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 24px;
    font-weight: 700;
    background: #fbf9f4;
    color: #0a463f;
    border: 1px solid #ece4d3;
    box-shadow: 0 10px 24px rgba(38,35,28,.08);
    white-space: nowrap;
  }
  .pill.teal {
    background: #0e5a52;
    color: #fff;
    border-color: #0a463f;
    box-shadow: 0 10px 24px rgba(14,90,82,.22);
  }
  .pill.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #efe9dd;
    color: #4a4338;
  }
  .pill.bronze {
    background: #f1e4d0;
    color: #8a5418;
  }
  .tagline {
    position: absolute;
    left: 72px;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 22px;
    color: #4a4338;
    font-weight: 600;
    letter-spacing: .1px;
  }
  .tagline .sep {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0e5a52;
    flex: none;
  }

  /* Right composition — vertical stack, no overlapping chips */
  .scene {
    position: absolute;
    right: 72px;
    top: 0;
    width: 400px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .dealer-card {
    width: 100%;
    background: linear-gradient(160deg, #0e5a52, #0a463f);
    border-radius: 26px;
    box-shadow: 0 16px 36px rgba(14,90,82,.28);
    padding: 24px 28px 22px;
    color: #ffffff;
    flex: none;
  }
  .dealer-card .emoji { font-size: 50px; line-height: 1; }
  .dealer-card .name {
    margin-top: 12px;
    font-size: 30px;
    font-weight: 800;
  }
  .dealer-card .meta {
    margin-top: 6px;
    font-size: 20px;
    color: #cfe4df;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
  }
  .connector {
    width: 4px;
    height: 28px;
    background: repeating-linear-gradient(
      to bottom,
      #0e5a52 0 7px,
      transparent 7px 12px
    );
    border: none;
    position: relative;
    flex: none;
  }
  .connector .dot-a, .connector .dot-b {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #0e5a52;
  }
  .connector .dot-a { top: -6px; }
  .connector .dot-b { bottom: -6px; }
  .send-label {
    background: #dcebe7;
    color: #0a463f;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 28px;
    font-weight: 800;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 8px 20px rgba(14,90,82,.18);
    white-space: nowrap;
    flex: none;
  }
  .agent-chip {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fbf9f4;
    border-radius: 999px;
    padding: 16px 30px 16px 20px;
    box-shadow: 0 16px 36px rgba(38,35,28,.09);
    border: 1px solid #ece4d3;
    width: 100%;
    justify-content: center;
    flex: none;
  }
  .agent-chip .emoji { font-size: 42px; line-height: 1; }
  .agent-chip .label { font-size: 28px; font-weight: 800; color: #26231c; white-space: nowrap; }
</style>
</head>
<body>
  <div class="left">
    <div class="tag">A2A AUTOMOTIVE-RETAIL PROFILE &middot; v1.2</div>
    <h1>Auto Agent<br><span class="accent">Protocol</span></h1>
    <div class="subtitle">Typed automotive commerce over A2A &middot; JSON-RPC only</div>
    <div class="pills">
      <div class="pill teal">v1.2</div>
      <div class="pill mono">SendMessage</div>
      <div class="pill bronze">five typed skills</div>
    </div>
  </div>

  <div class="tagline">
    <span>open standard</span>
    <span class="sep"></span>
    <span>typed messages</span>
    <span class="sep"></span>
    <span>consented leads</span>
  </div>

  <div class="scene">
    <div class="dealer-card">
      <div class="emoji">&#127980;</div>
      <div class="name">Dealership agent</div>
      <div class="meta">agent-card.json</div>
    </div>
    <div class="connector">
      <span class="dot-a"></span>
      <span class="dot-b"></span>
    </div>
    <div class="send-label">SendMessage</div>
    <div class="connector">
      <span class="dot-a"></span>
      <span class="dot-b"></span>
    </div>
    <div class="agent-chip">
      <span class="emoji">&#129302;</span>
      <span class="label">Buyer agent</span>
    </div>
  </div>
</body>
</html>
